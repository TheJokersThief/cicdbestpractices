<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620">
  <defs>
    <style>
      .sketch-text { font-family: 'Comic Sans MS', 'Marker Felt', cursive; font-size: 14px; }
      .sketch-text-large { font-family: 'Comic Sans MS', 'Marker Felt', cursive; font-size: 18px; font-weight: bold; }
      .sketch-text-small { font-family: 'Comic Sans MS', 'Marker Felt', cursive; font-size: 12px; }
      .red-stroke { stroke: #e63946; stroke-width: 2.5; fill: none; }
      .green-stroke { stroke: #2a9d8f; stroke-width: 2.5; fill: none; }
      .gray-stroke { stroke: #6c757d; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" class="sketch-text-large" fill="#212529">
    CI Feedback Loop Comparison
  </text>

  <!-- BEFORE Section -->
  <g id="before-section">
    <!-- Section label -->
    <text x="250" y="75" text-anchor="middle" class="sketch-text" fill="#e63946" font-weight="bold">
      ❌ BEFORE (16+ minutes)
    </text>

    <!-- Step 1: Write code -->
    <rect x="50" y="95" width="94" height="34" class="gray-stroke" fill="#f8f9fa" rx="0"/>
    <text x="97" y="117" text-anchor="middle" class="sketch-text-small" fill="#212529">
      Write code
    </text>

    <!-- Arrow 1 -->
    <path d="M 144,112 Q 161,112 178,112" class="gray-stroke" stroke-dasharray="2,2"/>
    <polygon points="178,112 173,109 173,115" fill="#6c757d"/>

    <!-- Step 2: Push -->
    <rect x="182" y="95" width="94" height="34" class="gray-stroke" fill="#f8f9fa" rx="0"/>
    <text x="229" y="117" text-anchor="middle" class="sketch-text-small" fill="#212529">
      Push
    </text>

    <!-- Arrow 2 -->
    <path d="M 276,112 Q 307,112 338,112" class="red-stroke" stroke-dasharray="2,2"/>
    <polygon points="338,112 333,109 333,115" fill="#e63946"/>

    <!-- Step 3: Wait 8 min -->
    <rect x="342" y="95" width="116" height="34" class="red-stroke" fill="#ffe5e5" rx="0"/>
    <text x="400" y="117" text-anchor="middle" class="sketch-text-small" fill="#d32f2f">
      ⏰ Wait 8 min
    </text>

    <!-- Arrow 3 -->
    <path d="M 458,112 Q 473,112 488,112" class="red-stroke" stroke-dasharray="2,2"/>
    <polygon points="488,112 483,109 483,115" fill="#e63946"/>

    <!-- Step 4: CI Fails -->
    <rect x="492" y="95" width="72" height="34" class="red-stroke" fill="#ffe5e5" rx="0"/>
    <text x="528" y="117" text-anchor="middle" class="sketch-text-small" fill="#d32f2f">
      ❌ CI fails
    </text>

    <!-- Arrow down to Fix -->
    <path d="M 528,129 Q 528,175 528,221" class="red-stroke" stroke-dasharray="2,2"/>
    <polygon points="528,221 525,216 531,216" fill="#e63946"/>

    <!-- Step 5: Fix -->
    <rect x="454" y="225" width="94" height="34" class="gray-stroke" fill="#f8f9fa" rx="0"/>
    <text x="501" y="247" text-anchor="middle" class="sketch-text-small" fill="#212529">
      Fix code
    </text>

    <!-- Arrow back up -->
    <path d="M 454,242 Q 324,242 140,242 L 140,117 Q 90,117 50,129"
          class="red-stroke" stroke-dasharray="2,2"/>
    <polygon points="50,129 47,134 53,134" fill="#e63946"/>

    <!-- Total time -->
    <text x="250" y="305" text-anchor="middle" class="sketch-text" fill="#e63946" font-weight="bold">
      Total: 16+ minutes 😤
    </text>
  </g>

  <!-- Divider -->
  <line x1="500" y1="55" x2="500" y2="570" stroke="#dee2e6" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- AFTER Section -->
  <g id="after-section">
    <!-- Section label -->
    <text x="750" y="75" text-anchor="middle" class="sketch-text" fill="#2a9d8f" font-weight="bold">
      ✅ AFTER (2 minutes)
    </text>

    <!-- Step 1: Write code -->
    <rect x="520" y="95" width="94" height="34" class="gray-stroke" fill="#f8f9fa" rx="0"/>
    <text x="567" y="117" text-anchor="middle" class="sketch-text-small" fill="#212529">
      Write code
    </text>

    <!-- Arrow 1 -->
    <path d="M 614,112 Q 641,112 668,112" class="green-stroke" stroke-dasharray="2,2"/>
    <polygon points="668,112 663,109 663,115" fill="#2a9d8f"/>

    <!-- Step 2: Validate 30s -->
    <rect x="672" y="95" width="122" height="34" class="green-stroke" fill="#e5f5f3" rx="0"/>
    <text x="733" y="117" text-anchor="middle" class="sketch-text-small" fill="#0a6e5c">
      ⚡ Validate 30s
    </text>

    <!-- Arrow 2 -->
    <path d="M 794,112 Q 821,112 848,112" class="green-stroke" stroke-dasharray="2,2"/>
    <polygon points="848,112 843,109 843,115" fill="#2a9d8f"/>

    <!-- Step 3: Fix -->
    <rect x="852" y="95" width="94" height="34" class="gray-stroke" fill="#f8f9fa" rx="0"/>
    <text x="899" y="117" text-anchor="middle" class="sketch-text-small" fill="#212529">
      Fix
    </text>

    <!-- Arrow down -->
    <path d="M 899,129 Q 899,175 899,221" class="green-stroke" stroke-dasharray="2,2"/>
    <polygon points="899,221 896,216 902,216" fill="#2a9d8f"/>

    <!-- Step 4: Validate 30s -->
    <rect x="838" y="225" width="122" height="34" class="green-stroke" fill="#e5f5f3" rx="0"/>
    <text x="899" y="247" text-anchor="middle" class="sketch-text-small" fill="#0a6e5c">
      ⚡ Validate 30s
    </text>

    <!-- Arrow down -->
    <path d="M 899,259 Q 899,305 899,351" class="green-stroke" stroke-dasharray="2,2"/>
    <polygon points="899,351 896,346 902,346" fill="#2a9d8f"/>

    <!-- Step 5: Push -->
    <rect x="852" y="355" width="94" height="34" class="gray-stroke" fill="#f8f9fa" rx="0"/>
    <text x="899" y="377" text-anchor="middle" class="sketch-text-small" fill="#212529">
      Push
    </text>

    <!-- Arrow down -->
    <path d="M 899,389 Q 899,435 899,481" class="green-stroke" stroke-dasharray="2,2"/>
    <polygon points="899,481 896,476 902,476" fill="#2a9d8f"/>

    <!-- Step 6: CI Passes -->
    <rect x="835" y="485" width="104" height="34" class="green-stroke" fill="#e5f5f3" rx="0"/>
    <text x="887" y="507" text-anchor="middle" class="sketch-text-small" fill="#0a6e5c">
      ✅ CI passes
    </text>

    <!-- Total time -->
    <text x="750" y="555" text-anchor="middle" class="sketch-text" fill="#2a9d8f" font-weight="bold">
      Total: 2 minutes 🎉
    </text>
  </g>

  <!-- Bottom summary -->
  <g id="summary">
    <rect x="250" y="575" width="500" height="40" rx="6" ry="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="500" y="599" text-anchor="middle" class="sketch-text" fill="#92400e">
      ⚡ 87.5% faster • Zero "fix CI" commits • Work offline
    </text>
  </g>
</svg>
