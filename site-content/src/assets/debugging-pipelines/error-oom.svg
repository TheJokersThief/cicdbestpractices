<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="oom-error-title">
  <title id="oom-error-title">Out of Memory Error with Annotations</title>

  <defs>
    <style>
      .terminal-bg { fill: #1e1e1e; }
      .terminal-text { fill: #d4d4d4; font-family: 'Courier New', monospace; font-size: 12px; }
      .error-text { fill: #f87171; }
      .annotation-box { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
      .annotation-text { fill: #92400e; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; }
      .annotation-line { stroke: #f59e0b; stroke-width: 2; fill: none; }
      .highlight { fill: #fbbf2433; }
    </style>
  </defs>

  <!-- Terminal background -->
  <rect x="20" y="20" width="860" height="220" rx="8" class="terminal-bg"/>

  <!-- Terminal title bar -->
  <text x="40" y="45" class="terminal-text" style="fill: #9ca3af;">npm run build</text>

  <!-- Error output -->
  <text x="40" y="75" class="terminal-text">&lt;--- Last few GCs ---&gt;</text>
  <text x="40" y="95" class="terminal-text"></text>
  <text x="40" y="115" class="error-text">FATAL ERROR: Reached heap limit Allocation failed - JavaScript heap out of memory</text>
  <text x="40" y="135" class="terminal-text"> 1: 0xb7d0e0 node::Abort() [node]</text>
  <text x="40" y="155" class="terminal-text"> 2: 0xa95f58 node::FatalError(char const*, char const*) [node]</text>
  <text x="40" y="175" class="terminal-text"> 3: 0xd2c6fe v8::Utils::ReportOOMFailure(...) [node]</text>
  <text x="40" y="195" class="terminal-text"> 4: 0xd2ca79 v8::internal::V8::FatalProcessOutOfMemory(...) [node]</text>
  <text x="40" y="215" class="terminal-text">Killed</text>

  <!-- Highlight important parts -->
  <rect x="105" y="102" width="565" height="18" class="highlight"/>
  <rect x="40" y="202" width="60" height="18" class="highlight"/>

  <!-- Annotation 1: Memory Error -->
  <rect x="50" y="260" width="250" height="45" rx="6" class="annotation-box"/>
  <text x="175" y="278" class="annotation-text" text-anchor="middle">Heap Out of Memory</text>
  <text x="175" y="292" class="annotation-text" text-anchor="middle" style="font-weight: 400;">Process used all available memory</text>
  <path d="M 200 260 L 350 128" class="annotation-line"/>

  <!-- Annotation 2: Process Killed -->
  <rect x="350" y="260" width="200" height="45" rx="6" class="annotation-box"/>
  <text x="450" y="278" class="annotation-text" text-anchor="middle">Process Killed</text>
  <text x="450" y="292" class="annotation-text" text-anchor="middle" style="font-weight: 400;">OS terminated the process</text>
  <path d="M 400 260 L 70 220" class="annotation-line"/>

  <!-- Memory usage visualization -->
  <g transform="translate(600, 250)">
    <text x="100" y="5" style="fill: #9ca3af; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; text-anchor: middle;">Memory Usage</text>

    <!-- Memory bar -->
    <rect x="10" y="15" width="180" height="30" rx="4" style="fill: #374151; stroke: #4b5563; stroke-width: 2;"/>
    <rect x="10" y="15" width="180" height="30" rx="4" style="fill: #ef4444;"/>

    <text x="100" y="35" style="fill: white; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle;">100%</text>
    <text x="100" y="60" style="fill: #f87171; font-family: system-ui, -apple-system, sans-serif; font-size: 10px; text-anchor: middle;">Limit Reached</text>
  </g>

  <!-- Key insight box -->
  <rect x="50" y="325" width="820" height="60" rx="6" style="fill: #dbeafe; stroke: #3b82f6; stroke-width: 2;"/>
  <text x="460" y="348" style="fill: #1e40af; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle;">
    💡 Build process exceeded available memory (typically 2-4GB in CI)
  </text>
  <text x="460" y="365" style="fill: #1e40af; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; text-anchor: middle;">
    Common in: Large builds, webpack bundles, image processing, or memory leaks
  </text>
  <text x="460" y="379" style="fill: #1e40af; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; text-anchor: middle;">
    Fix: Increase Node heap (NODE_OPTIONS=--max-old-space-size=4096), optimize build, process data in chunks
  </text>
</svg>
