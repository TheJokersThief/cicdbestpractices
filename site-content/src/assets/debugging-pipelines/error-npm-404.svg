<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="npm-error-title">
  <title id="npm-error-title">npm 404 Error with Annotations</title>

  <defs>
    <style>
      .terminal-bg { fill: #1e1e1e; }
      .terminal-text { fill: #d4d4d4; font-family: 'Courier New', monospace; font-size: 13px; }
      .error-text { fill: #f87171; }
      .annotation-box { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
      .annotation-text { fill: #92400e; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; }
      .annotation-line { stroke: #f59e0b; stroke-width: 2; fill: none; }
      .highlight { fill: #fbbf2433; }
    </style>
  </defs>

  <!-- Terminal background -->
  <rect x="20" y="20" width="860" height="220" rx="8" class="terminal-bg"/>

  <!-- Terminal title bar -->
  <text x="40" y="45" class="terminal-text" style="fill: #9ca3af;">npm install</text>

  <!-- Error output -->
  <text x="40" y="75" class="error-text">npm ERR! code E404</text>
  <text x="40" y="95" class="error-text">npm ERR! 404 Not Found - GET https://registry.npmjs.org/@company/private-pkg</text>
  <text x="40" y="115" class="error-text">npm ERR! 404</text>
  <text x="40" y="135" class="error-text">npm ERR! 404  '@company/private-pkg@^1.2.0' is not in the npm registry.</text>
  <text x="40" y="155" class="error-text">npm ERR! 404 You should bug the author to publish it (or use the name yourself!)</text>
  <text x="40" y="175" class="error-text">npm ERR! 404</text>
  <text x="40" y="195" class="error-text">npm ERR! 404 Note that you can also install from a</text>
  <text x="40" y="215" class="error-text">npm ERR! 404 tarball, folder, http url, or git url.</text>

  <!-- Highlight important parts -->
  <rect x="105" y="82" width="45" height="18" class="highlight"/>
  <rect x="393" y="102" width="485" height="18" class="highlight"/>
  <rect x="150" y="122" width="445" height="18" class="highlight"/>

  <!-- Annotation 1: Error Code -->
  <rect x="50" y="260" width="180" height="50" rx="6" class="annotation-box"/>
  <text x="140" y="280" class="annotation-text" text-anchor="middle">Error Code</text>
  <text x="140" y="295" class="annotation-text" text-anchor="middle" style="font-weight: 400;">HTTP 404 = Not Found</text>
  <path d="M 127 260 L 127 100" class="annotation-line"/>

  <!-- Annotation 2: Registry URL -->
  <rect x="360" y="260" width="220" height="50" rx="6" class="annotation-box"/>
  <text x="470" y="280" class="annotation-text" text-anchor="middle">Registry URL</text>
  <text x="470" y="295" class="annotation-text" text-anchor="middle" style="font-weight: 400;">Where npm is looking</text>
  <path d="M 500 260 L 635 115" class="annotation-line"/>

  <!-- Annotation 3: Package Name -->
  <rect x="650" y="260" width="220" height="50" rx="6" class="annotation-box"/>
  <text x="760" y="280" class="annotation-text" text-anchor="middle">Package Name</text>
  <text x="760" y="295" class="annotation-text" text-anchor="middle" style="font-weight: 400;">Check spelling & scope</text>
  <path d="M 700 260 L 370 145" class="annotation-line"/>

  <!-- Key insight box -->
  <rect x="50" y="330" width="820" height="50" rx="6" style="fill: #dbeafe; stroke: #3b82f6; stroke-width: 2;"/>
  <text x="460" y="353" style="fill: #1e40af; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle;">
    💡 Common Causes: Typo in name, private package needs auth, or package was unpublished
  </text>
  <text x="460" y="370" style="fill: #1e40af; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; text-anchor: middle;">
    Fix: Check package.json spelling, verify registry auth is configured
  </text>
</svg>
